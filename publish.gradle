task generateChecksums {
    doLast {
        def localRepoPath = new File(System.getProperty("user.home"), ".m2/repository")

        def groupPath = project.group.replace('.', '/')
        def artifactPath = new File(localRepoPath, "io/github/windysha/bypassHiddenApiRestriction/1.2.0/")
        println "Generating checksums in: $artifactPath"

        artifactPath.listFiles(new FilenameFilter() {
            boolean accept(File dir, String name) {
                return !name.endsWith(".md5") && !name.endsWith(".sha1")
            }
        }).each { file ->
            // generate md5
//            def md5 = file.bytes.digest("MD5").encodeHex().toString()
//            new File(file.absolutePath + ".md5").text = md5
//
//            // generate sha1
//            def sha1 = file.bytes.digest("SHA-1").encodeHex().toString()
//            new File(file.absolutePath + ".sha1").text = sha1

            def md5 = toHexString(digest(file.bytes, "MD5"))
            new File(file.absolutePath + ".md5").text = md5

            def sha1 = toHexString(digest(file.bytes, "SHA-1"))
            new File(file.absolutePath + ".sha1").text = sha1
        }
    }
}

String toHexString(byte[] bytes) {
    bytes.collect { String.format("%02x", it) }.join()
}

byte[] digest(byte[] input, String algorithm) {
    return java.security.MessageDigest.getInstance(algorithm).digest(input)
}

publishToMavenLocal.dependsOn generateChecksums


